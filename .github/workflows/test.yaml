# This workflow will do a clean installation of node dependencies, lint, build the Vite project, and run tests.
name: Vite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci
      - name: Security Audit
        # Fails the pipeline if high or critical vulnerabilities are found in dependencies.
        run: npm audit --audit-level=high

      - name: Run Linter
        # Most Vite templates include a lint script. This runs it safely.
        run: npm run lint --if-present

      - name: Check Formatting
        id: format
        continue-on-error: true
        run: npx prettier --check .

      - name: Auto-format flagged files
        if: steps.format.outcome == 'failure'
        run: |
          npx prettier --write .
          npx prettier --check .

      - name: Build Project
        # Compiles TypeScript (if used) and bundles the app via Vite
        run: npm run build

      - name: Run Tests
        run: npm test --if-present

      - name: Upload Build Artifact
        # Saves the Vite output folder ('dist') so it can be deployed or downloaded
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
